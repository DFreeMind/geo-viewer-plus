<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark light">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body, #map { width:100%; height:100%; margin:0; overflow:hidden; background:#111827; font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button, select { font:inherit; }
    .map-status { display:flex; align-items:center; gap:6px; position:absolute; z-index:1000; left:14px; bottom:12px; padding:8px 11px; border:1px solid rgba(148,163,184,.32); border-radius:10px; background:rgba(15,23,42,.9); color:#cbd5e1; pointer-events:none; box-shadow:0 5px 15px rgba(0,0,0,.2); backdrop-filter:blur(10px); }
    .status-dot { width:7px; height:7px; border-radius:50%; background:#34d399; box-shadow:0 0 0 3px rgba(52,211,153,.14); }
    .map-status strong { color:#22c55e; font-weight:600; }
    .map-status .zoom-level { color:#93c5fd; font-weight:600; }
    .leaflet-control-layers { border:1px solid rgba(148,163,184,.35)!important; border-radius:6px!important; background:#0f172a!important; color:#e2e8f0!important; }
    .leaflet-control-zoom a { background:#0f172a!important; color:#e2e8f0!important; border-color:#334155!important; }
    .leaflet-popup-content-wrapper { background:#0f172a; color:#e2e8f0; border:1px solid #334155; border-radius:9px; box-shadow:0 12px 28px rgba(0,0,0,.42); }
    .leaflet-popup-tip { background:#0f172a; }
    .leaflet-popup-content { margin:0; width:360px!important; max-width:calc(100vw - 56px); }
    .leaflet-popup-close-button { color:#94a3b8!important; font-size:18px!important; padding:6px 8px 0 0!important; }
    .leaflet-popup-close-button:hover { color:#f8fafc!important; }
    .feature-popup { width:100%; max-width:360px; overflow:hidden; line-height:1.35; }
    .feature-popup-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 30px 9px 12px; border-bottom:1px solid #263449; color:#f8fafc; font-weight:600; }
    .feature-popup-type { color:#22c55e; font-size:11px; font-weight:500; }
    .feature-popup-grid { max-height:238px; overflow-y:auto; overflow-x:hidden; padding:7px 8px 8px 12px; scrollbar-width:thin; scrollbar-color:#475569 transparent; }
    .feature-popup-grid::-webkit-scrollbar { width:7px; }
    .feature-popup-grid::-webkit-scrollbar-track { background:transparent; }
    .feature-popup-grid::-webkit-scrollbar-thumb { background:#475569; border-radius:8px; }
    .feature-row { display:grid; grid-template-columns:minmax(76px, 31%) minmax(0, 1fr); gap:10px; padding:5px 0; border-bottom:1px solid rgba(51,65,85,.42); }
    .feature-row:last-child { border-bottom:0; }
    .feature-key { color:#86efac; font-weight:600; overflow-wrap:anywhere; }
    .feature-value { color:#e2e8f0; min-width:0; overflow-wrap:anywhere; white-space:normal; }
    .map-notice { color:#fbbf24; }
    .map-retry-button { display:none; pointer-events:auto; padding:3px 7px; border:1px solid rgba(251,191,36,.45); border-radius:6px; background:rgba(120,53,15,.7); color:#fde68a; cursor:pointer; }
    .map-retry-button.visible { display:inline-flex; }
    .floating-toolbar { position:absolute; z-index:1000; top:14px; right:14px; width:318px; padding:9px; border:1px solid rgba(148,163,184,.28); border-radius:18px; background:rgba(10,18,34,.94); box-shadow:0 20px 48px rgba(0,0,0,.34); color:#cbd5e1; backdrop-filter:blur(18px); transition:width .18s ease, padding .18s ease, background .18s ease, border-color .18s ease; }
    .floating-toolbar.collapsed { width:auto; padding:0; border-color:transparent; background:transparent; box-shadow:none; backdrop-filter:none; }
    .toolbar-toggle { display:flex; align-items:center; gap:8px; width:100%; height:36px; padding:0 10px; border:1px solid rgba(148,163,184,.36); border-radius:11px; background:rgba(15,23,42,.96); color:#dbeafe; cursor:pointer; box-shadow:0 8px 20px rgba(0,0,0,.24); }
    .collapsed .toolbar-toggle { width:42px; height:42px; justify-content:center; padding:0; border-radius:13px; background:rgba(15,23,42,.96); }
    .toolbar-toggle:hover { border-color:#60a5fa; background:#172554; }
    .toolbar-toggle-icon { display:inline-flex; color:#93c5fd; }
    .toolbar-toggle-icon svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .toolbar-toggle-label { flex:1; text-align:left; font-size:10px; font-weight:750; letter-spacing:.12em; }
    .collapsed .toolbar-toggle-label { display:none; }
    .toolbar-toggle-chevron { color:#94a3b8; font-size:14px; transition:transform .18s ease; }
    .collapsed .toolbar-toggle-chevron { display:none; }
    .floating-toolbar:not(.collapsed) .toolbar-toggle-chevron { transform:rotate(180deg); }
    .toolbar-panel { padding:13px 3px 3px; }
    .floating-toolbar.collapsed .toolbar-panel { display:none; }
    .floating-toolbar-head { display:flex; justify-content:space-between; align-items:flex-start; margin:0 2px 13px; }
    .floating-toolbar-title { color:#f8fafc; font-size:12px; font-weight:750; letter-spacing:.08em; }
    .floating-toolbar-subtitle { margin-top:3px; color:#64748b; font-size:10px; }
    .floating-toolbar-geometry { max-width:100px; overflow:hidden; padding:3px 7px; border:1px solid rgba(96,165,250,.22); border-radius:7px; color:#93c5fd; font-size:10px; text-overflow:ellipsis; white-space:nowrap; }
    .toolbar-group { position:relative; z-index:1; margin-bottom:10px; padding:10px; border:1px solid rgba(71,85,105,.55); border-radius:12px; background:rgba(15,23,42,.62); }
    .toolbar-group.source-group { z-index:30; }
    .toolbar-section-label { display:flex; align-items:center; justify-content:space-between; margin:0 0 7px; color:#94a3b8; font-size:10px; font-weight:750; letter-spacing:.1em; text-transform:uppercase; }
    .toolbar-section-label::after { content:'BASE MAP'; color:#64748b; font-size:9px; letter-spacing:.08em; }
    .source-picker { position:relative; z-index:10; margin-bottom:7px; }
    .source-picker-button { display:flex; align-items:center; justify-content:space-between; width:100%; height:38px; padding:0 10px; border:1px solid #475569; border-radius:9px; background:#1e293b; color:#f8fafc; outline:none; cursor:pointer; text-align:left; }
    .source-picker-button:hover, .source-picker-button[aria-expanded="true"] { border-color:#60a5fa; box-shadow:0 0 0 2px rgba(96,165,250,.2); }
    .source-picker-value { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .source-picker-chevron { margin-left:8px; color:#94a3b8; transition:transform .16s ease; }
    .source-picker-button[aria-expanded="true"] .source-picker-chevron { transform:rotate(180deg); }
    .source-menu { position:absolute; z-index:100; left:0; right:0; top:calc(100% + 6px); display:none; max-height:245px; overflow-y:auto; padding:5px; border:1px solid #475569; border-radius:10px; background:#111c31; box-shadow:0 18px 38px rgba(0,0,0,.46); scrollbar-width:thin; scrollbar-color:#64748b transparent; }
    .source-menu.open { display:block; }
    .source-menu.open-up { top:auto; bottom:calc(100% + 6px); }
    .source-menu-group { padding:6px 8px 4px; color:#64748b; font-size:9px; font-weight:750; letter-spacing:.1em; text-transform:uppercase; }
    .source-menu-option { display:block; width:100%; margin:1px 0; padding:8px 9px; border:0; border-radius:7px; background:transparent; color:#dbeafe; cursor:pointer; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .source-menu-option:hover, .source-menu-option[aria-selected="true"] { background:#263d61; color:#f8fafc; }
    .source-menu-option[aria-selected="true"] { box-shadow:inset 2px 0 #60a5fa; }
    .source-select-hidden { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
    .toolbar-source-meta { display:flex; align-items:center; justify-content:space-between; min-height:21px; color:#94a3b8; font-size:10px; }
    .toolbar-source-meta span:last-child { max-width:165px; overflow:hidden; text-align:right; text-overflow:ellipsis; white-space:nowrap; }
    .toolbar-source-kind { padding:2px 6px; border-radius:5px; background:rgba(16,185,129,.12); color:#a7f3d0; font-weight:650; }
    .toolbar-source-kind.custom { background:rgba(234,179,8,.14); color:#fcd34d; }
    .toolbar-actions, .toolbar-manage-actions { display:grid; grid-template-columns:1fr 1.2fr; gap:7px; }
    .toolbar-manage-actions { grid-template-columns:1fr 1fr; margin-top:7px; }
    .toolbar-actions button, .toolbar-manage-actions button { display:flex; align-items:center; justify-content:center; gap:5px; width:100%; height:33px; border:1px solid #475569; border-radius:8px; background:#263449; color:#dbeafe; cursor:pointer; transition:background .16s ease, border-color .16s ease, transform .16s ease; }
    .toolbar-actions button:hover, .toolbar-manage-actions button:hover { background:#334155; border-color:#60a5fa; transform:translateY(-1px); }
    .toolbar-actions button:active, .toolbar-manage-actions button:active { transform:translateY(0); }
    .toolbar-actions button:disabled, .toolbar-manage-actions button:disabled { cursor:not-allowed; opacity:.42; transform:none; }
    .toolbar-actions .toolbar-default-button { color:#bfdbfe; }
    .toolbar-manage-actions .toolbar-remove-button { color:#fda4af; }
    .toolbar-icon { display:inline-flex; }
    .toolbar-icon svg { width:13px; height:13px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .floating-toolbar-note { margin:2px 3px 0; color:#64748b; font-size:10px; line-height:1.5; }
  </style>
</head>
<body>
<div id="map"></div>
<div class="map-status"><span class="status-dot"></span><strong id="count">0</strong> features · <span id="geometry">waiting for result set</span> · <span id="zoom" class="zoom-level">Z=5</span><span id="mapNotice" class="map-notice"></span><button id="retrySourceButton" class="map-retry-button" type="button">Retry</button></div>
<div class="floating-toolbar collapsed" id="floatingToolbar">
  <button class="toolbar-toggle" id="toolbarToggle" type="button" aria-expanded="false" title="Map controls"><span class="toolbar-toggle-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M8 14v6"/></svg></span><span class="toolbar-toggle-label">MAP CONTROLS</span><span class="toolbar-toggle-chevron">⌄</span></button>
  <div class="toolbar-panel" id="toolbarPanel">
    <div class="floating-toolbar-head"><div><div class="floating-toolbar-title">MAP CONTROLS</div><div class="floating-toolbar-subtitle">Choose a base map for this result set</div></div><span id="toolbarGeometry" class="floating-toolbar-geometry">geom</span></div>
    <div class="toolbar-group source-group"><span class="toolbar-section-label">Map layers</span><div class="source-picker" id="sourcePicker"><button id="sourcePickerButton" class="source-picker-button" type="button" aria-haspopup="listbox" aria-expanded="false"><span id="sourcePickerValue" class="source-picker-value">Choose a map</span><span class="source-picker-chevron" aria-hidden="true">⌄</span></button><div id="sourceMenu" class="source-menu" role="listbox"></div><select id="sourceSelect" class="source-select-hidden" aria-hidden="true" tabindex="-1"></select></div><div class="toolbar-source-meta"><span id="sourceKind" class="toolbar-source-kind">Built-in map</span><span id="sourceAttribution"></span></div></div>
    <div class="toolbar-group"><span class="toolbar-section-label">Manage</span><div class="toolbar-actions"><button class="toolbar-default-button" id="defaultSourceButton" type="button"><span class="toolbar-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-2.9-5.6 2.9 1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg></span>Set default</button><button id="addSourceButton" type="button"><span class="toolbar-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>Add custom</button></div><div class="toolbar-manage-actions"><button id="editSourceButton" type="button" disabled><span class="toolbar-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m4 16-.8 4.8L8 20l11.8-11.8a2.8 2.8 0 0 0-4-4L4 16Z"/><path d="m14.5 5.5 4 4"/></svg></span>Edit custom</button><button class="toolbar-remove-button" id="removeSourceButton" type="button" disabled><span class="toolbar-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 11v6M14 11v6M8 7l1-3h6l1 3M7 7l1 14h8l1-14"/></svg></span>Remove</button></div></div>
    <div class="floating-toolbar-note">Built-in maps are protected. Custom maps can be edited or removed here. Select a row or a feature to keep the table and map in sync.</div>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.vectorgrid@1.3.0/dist/Leaflet.VectorGrid.bundled.js"></script>
<script>
  const map = L.map('map', { zoomControl:true, preferCanvas:true }).setView([43.79,87.62], 5);
  const layers = {};
  const sourceDefinitions = new Map();
  const features = new Map();
  const layerHealth = {};
  let selected = [];
  let currentLayer = null;
  let activeSource = '';
  let lastMapClickRow = -1;
  let lastMapClickAt = 0;
  const defaultStyle = { color:'#22c55e', weight:3, opacity:.9, fillColor:'#22c55e', fillOpacity:.28 };
  const selectedStyle = { color:'#ff5a1f', weight:7, opacity:1, fillColor:'#ff5a1f', fillOpacity:.55 };
  let defaultSource = '';
  function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function template(t) { return t.replaceAll('{s}', '{s}'); }
  function vectorTileStyleForLayer(layerName) {
    const layer = String(layerName || '').toLowerCase();
    return (properties, zoom) => {
      const value = String((properties && (properties.class || properties.kind || properties.type || properties.category || properties.subclass)) || '').toLowerCase();
      const level = Number.isFinite(zoom) ? zoom : map.getZoom();
      const road = layer.includes('road') || layer.includes('transport') || layer.includes('highway') || value.includes('road') || value.includes('highway');
      const water = layer.includes('water') || layer.includes('river') || layer.includes('ocean') || value.includes('water') || value.includes('river');
      const green = layer.includes('park') || layer.includes('landuse') || layer.includes('landcover') || layer.includes('forest') || value.includes('park') || value.includes('forest');
      const building = layer.includes('building') || value.includes('building');
      const boundary = layer.includes('boundary') || layer.includes('admin');
      const point = layer.includes('poi') || layer.includes('place') || layer.includes('label') || layer.includes('point');
      if (water) return { color:'#4f86a4', weight:.55, opacity:.62, fillColor:'#17384c', fillOpacity:.62, fill:true };
      if (green) return { color:'#517d68', weight:.45, opacity:.48, fillColor:'#214936', fillOpacity:.34, fill:true };
      if (building) return { color:'#64748b', weight:.35, opacity:.32, fillColor:'#475569', fillOpacity:.13, fill:true };
      if (road) {
        const major = value.includes('motorway') || value.includes('trunk') || value.includes('primary');
        const minor = value.includes('path') || value.includes('track') || value.includes('service');
        return { color:major ? '#c9b98a' : '#8b98a8', weight:major ? Math.min(2.4, .7 + level / 10) : minor ? .38 : .62, opacity:level < 7 ? .35 : .7, fill:false };
      }
      if (boundary) return { color:'#7884a0', weight:.55, opacity:.45, dashArray:'3 4', fill:false };
      if (point) return { color:'#d3a76a', weight:.4, opacity:.62, fillColor:'#d3a76a', fillOpacity:.52, radius:Math.min(3.5, 1.5 + level / 10), fill:true };
      return { color:'#7aa2bf', weight:.72, opacity:.68, fillColor:'#28475b', fillOpacity:.2, fill:true, radius:2.4 };
    };
  }
  function createSourceLayer(source) {
    const options = { maxZoom:22, attribution:source.attribution || '', tms:!!source.tms };
    if (source.template.indexOf('{s}') >= 0) options.subdomains = (source.subdomains || 'abc').split('');
    if (source.type === 'mvt') {
      if (!L.vectorGrid || !L.vectorGrid.protobuf) throw new Error('MVT support library is unavailable');
      const layerNames = (source.vectorLayer || 'sliced').split(',').map(name => name.trim()).filter(Boolean);
      options.interactive = false;
      options.rendererFactory = L.canvas.tile;
      options.vectorTileLayerStyles = {};
      const knownLayerNames = ['water', 'waterway', 'landcover', 'landuse', 'park', 'forest', 'building', 'road', 'roads', 'transportation', 'highway', 'boundary', 'admin', 'place', 'poi', 'label', 'point'];
      [...new Set([...layerNames, ...knownLayerNames])].forEach(name => { options.vectorTileLayerStyles[name] = vectorTileStyleForLayer(name); });
      return L.vectorGrid.protobuf(template(source.template), options);
    }
    return L.tileLayer(template(source.template), options);
  }
  function addSource(source) {
    if (sourceDefinitions.has(source.name) && layers[source.name]) return;
    sourceDefinitions.set(source.name, source);
    let layer;
    try { layer = createSourceLayer(source); }
    catch (error) { layerHealth[source.name] = { errors:1, retries:0, message:String(error.message || error) }; ensureSourceOption(source); if (!currentLayer) activeSource = source.name; updateSourceMeta(); updateTileNotice(); return; }
    ensureSourceOption(source);
    layerHealth[source.name] = { errors:0, retries:0 };
    layer.on('tileload', function() {
      const health = layerHealth[source.name];
      health.errors = Math.max(0, health.errors - 1);
      health.retries = 0;
      health.message = '';
      if (source.type === 'mvt') refreshMvtStyles(layer);
      updateTileNotice();
    });
    layer.on('tileerror', function() {
      const health = layerHealth[source.name];
      health.errors++;
      if (health.retries < 2) {
        health.retries++;
        setTimeout(() => layer.redraw(), 350 * health.retries);
      }
      updateTileNotice();
    });
    layers[source.name] = layer;
    if (!currentLayer) { currentLayer = layers[source.name]; currentLayer.addTo(map); activeSource = source.name; }
  }
  function refreshMvtStyles(layer) {
    if (!layer || !layer.getDataLayerNames || !layer.options || !layer.options.vectorTileLayerStyles) return;
    const names = layer.getDataLayerNames();
    let changed = false;
    names.forEach(name => {
      if (!layer.options.vectorTileLayerStyles[name]) {
        layer.options.vectorTileLayerStyles[name] = vectorTileStyleForLayer(name);
        changed = true;
      }
    });
    if (changed && layer.redraw) layer.redraw();
  }
  function addSourcesFromJava(sources) { (sources || []).forEach(source => addSource(source)); updateSourceLabels(); }
  function addSourceFromJava(source, selectIt) { addSource(source); if (selectIt) { const select = document.getElementById('sourceSelect'); if (select) select.value = source.name; switchSource(source.name); } if (window.dg && window.dg.sourcesChanged) window.dg.sourcesChanged(Object.keys(layers)); }
  function switchSource(name) { if (!sourceDefinitions.has(name)) return; if (currentLayer) map.removeLayer(currentLayer); currentLayer = layers[name] || null; activeSource = name; const select = document.getElementById('sourceSelect'); if (select) { select.value = name; updateSourcePickerValue(); renderSourceMenu(); } if (currentLayer) currentLayer.addTo(map); updateSourceMeta(); updateTileNotice(); }
  function removeSource(name) {
    if (!sourceDefinitions.has(name)) return;
    const wasCurrent = activeSource === name;
    if (currentLayer === layers[name]) map.removeLayer(currentLayer);
    delete layers[name]; delete layerHealth[name]; sourceDefinitions.delete(name);
    const option = Array.from(document.querySelectorAll('#sourceSelect option')).find(candidate => candidate.value === name);
    if (option) option.remove();
    document.querySelectorAll('#sourceSelect optgroup').forEach(group => { if (!group.children.length) group.remove(); });
    if (wasCurrent) {
      const fallback = sourceDefinitions.keys().next().value;
      currentLayer = null; activeSource = '';
      if (fallback) switchSource(fallback);
    }
    updateSourceLabels(); updateSourceMeta();
  }
  function ensureSourceOption(source) {
    const select = document.getElementById('sourceSelect');
    if (!select || Array.from(select.options).some(option => option.value === source.name)) return;
    const groupId = source.custom ? 'custom' : 'builtin';
    let group = select.querySelector('optgroup[data-group="'+groupId+'"]');
    if (!group) { group = document.createElement('optgroup'); group.dataset.group = groupId; group.label = groupId === 'custom' ? '自定义地图' : '内置地图'; select.appendChild(group); }
    const option = document.createElement('option'); option.value = source.name; option.dataset.sourceName = source.name; option.textContent = source.name; group.appendChild(option); updateSourceLabels();
  }
  function updateSourceLabels() {
    const select=document.getElementById('sourceSelect');
    if(!select) return;
    Array.from(select.options).forEach(option => { const name=option.dataset.sourceName || option.value; option.textContent=(name===defaultSource?'★ ':'')+name; });
    renderSourceMenu();
    updateSourcePickerValue();
  }
  function updateSourcePickerValue() {
    const select=document.getElementById('sourceSelect');
    const value=document.getElementById('sourcePickerValue');
    if (!select || !value) return;
    const source=sourceDefinitions.get(select.value);
    value.textContent=source ? (select.value === defaultSource ? '★ ' : '') + source.name : 'Choose a map';
  }
  function renderSourceMenu() {
    const menu=document.getElementById('sourceMenu');
    const select=document.getElementById('sourceSelect');
    if (!select || !menu) return;
    menu.innerHTML='';
    const groups=[
      { label:'内置地图', custom:false },
      { label:'自定义地图', custom:true }
    ];
    groups.forEach(group => {
      const items=Array.from(sourceDefinitions.values()).filter(source => !!source.custom === group.custom);
      if (!items.length) return;
      const heading=document.createElement('div');
      heading.className='source-menu-group';
      heading.textContent=group.label;
      menu.appendChild(heading);
      items.forEach(source => {
        const item=document.createElement('button');
        item.type='button';
        item.className='source-menu-option';
        item.setAttribute('role','option');
        item.setAttribute('aria-selected', String(source.name === select.value));
        item.dataset.value=source.name;
        item.textContent=(source.name === defaultSource ? '★ ' : '') + source.name;
        item.addEventListener('click', () => {
          select.value=source.name;
          select.dispatchEvent(new Event('change', { bubbles:true }));
          closeSourceMenu();
        });
        menu.appendChild(item);
      });
    });
  }
  function closeSourceMenu() {
    const button=document.getElementById('sourcePickerButton');
    const menu=document.getElementById('sourceMenu');
    if (button) button.setAttribute('aria-expanded','false');
    if (menu) menu.classList.remove('open','open-up');
  }
  function toggleSourceMenu() {
    const button=document.getElementById('sourcePickerButton');
    const menu=document.getElementById('sourceMenu');
    if (!button || !menu) return;
    const opening=button.getAttribute('aria-expanded') !== 'true';
    if (!opening) { closeSourceMenu(); return; }
    button.setAttribute('aria-expanded','true');
    menu.classList.add('open');
    menu.classList.toggle('open-up', button.getBoundingClientRect().bottom + menu.offsetHeight > window.innerHeight - 12);
  }
  function updateSourceMeta() {
    const source = sourceDefinitions.get(activeSource);
    const kind = document.getElementById('sourceKind');
    const attribution = document.getElementById('sourceAttribution');
    const edit = document.getElementById('editSourceButton');
    const remove = document.getElementById('removeSourceButton');
    const custom = !!(source && source.custom);
    if (kind) { kind.textContent = source && source.type === 'mvt' ? 'MVT vector source' : custom ? 'Custom raster map' : 'Built-in raster map'; kind.classList.toggle('custom', custom || !!(source && source.type === 'mvt')); }
    if (attribution) attribution.textContent = source && source.attribution ? source.attribution : '';
    if (edit) edit.disabled = !custom;
    if (remove) remove.disabled = !custom;
  }
  function setDefaultSource(name) { if (!layers[name]) return; defaultSource=name; updateSourceLabels(); }
  function updateTileNotice() {
    const notice = document.getElementById('mapNotice');
    const retry = document.getElementById('retrySourceButton');
    const health = layerHealth[activeSource];
    if (!notice || !health || health.errors === 0) {
      if (notice) notice.textContent = '';
      if (retry) retry.classList.remove('visible');
      return;
    }
    if (health.message) notice.textContent = ' · ' + health.message;
    else notice.textContent = ' · ' + health.errors + ' tile errors';
    if (retry) retry.classList.add('visible');
  }
  function retryActiveSource() {
    const layer = layers[activeSource];
    const health = layerHealth[activeSource];
    if (!layer || !health) return;
    health.errors = 0;
    health.retries = 0;
    health.message = '';
    if (layer.redraw) layer.redraw();
    updateTileNotice();
  }
  function setStyle(feature, selectedFlag) {
    if (feature.setStyle) feature.setStyle(selectedFlag ? selectedStyle : defaultStyle);
    else if (feature.eachLayer) feature.eachLayer(child => setStyle(child, selectedFlag));
    if (feature.setIcon) feature.setOpacity(selectedFlag ? 1 : .78);
  }
  function parseCoordinate(text) {
    const values = text.trim().split(/\s+/).map(Number);
    if (values.length < 2 || !Number.isFinite(values[0]) || !Number.isFinite(values[1])) throw new Error('Invalid coordinate');
    const coordinate = [values[1], values[0]];
    return coordinate;
  }
  function parseWktGroups(text) {
    let index = 0;
    function skip() { while (index < text.length && /\s/.test(text[index])) index++; }
    function parseGroup() {
      skip();
      if (text[index] !== '(') return parseCoordinate(readToken());
      index++;
      const result = [];
      while (index < text.length) {
        skip();
        if (text[index] === ')') { index++; return result; }
        result.push(text[index] === '(' ? parseGroup() : parseCoordinate(readToken()));
        skip();
        if (text[index] === ',') { index++; continue; }
        if (text[index] === ')') { index++; return result; }
        throw new Error('Invalid WKT group');
      }
      throw new Error('Unclosed WKT group');
    }
    function readToken() {
      const start = index;
      while (index < text.length && text[index] !== ',' && text[index] !== ')' && text[index] !== '(') index++;
      return text.slice(start, index);
    }
    return parseGroup();
  }
  function parseWkt(wkt) {
    const match = String(wkt).trim().replace(/^srid=\d+;\s*/i, '').match(/^([a-z]+)(?:\s+(?:z|m|zm))?\s*(.*)$/i);
    if (!match) throw new Error('Invalid WKT');
    const type = match[1].toUpperCase();
    const body = match[2].trim();
    if (/^empty$/i.test(body)) throw new Error('Empty geometry');
    const groups = parseWktGroups(body);
    let layer;
    if (type === 'POINT') layer = L.circleMarker(groups[0], { radius:6, color:defaultStyle.color, weight:2, fillColor:defaultStyle.fillColor, fillOpacity:.75 });
    else if (type === 'LINESTRING') layer = L.polyline(groups, defaultStyle);
    else if (type === 'POLYGON') layer = L.polygon(groups, defaultStyle);
    else if (type === 'MULTILINESTRING') layer = L.featureGroup(groups.map(line => L.polyline(line, defaultStyle)));
    else if (type === 'MULTIPOLYGON') layer = L.featureGroup(groups.map(polygon => L.polygon(polygon, defaultStyle)));
    else if (type === 'MULTIPOINT') layer = L.featureGroup(groups.map(point => L.circleMarker(point[0] || point, { radius:6, color:defaultStyle.color, weight:2, fillColor:defaultStyle.fillColor, fillOpacity:.75 })));
    else throw new Error('Unsupported geometry type: ' + type);
    return layer;
  }
  function clearFeatures() { features.forEach(f => f.remove()); features.clear(); selected=[]; }
  function addWkt(wkt, row, attributes) {
    try {
      const object = parseWkt(wkt);
      object.addTo(map); features.set(row, object); setStyle(object, false);
      const type = (String(wkt).match(/(?:srid=\d+;)?\s*([a-z]+)/i) || [,'geometry'])[1].toUpperCase();
      const rows = attributes.filter(a => a[1] !== '' && a[1] !== 'null').map(a => '<div class="feature-row"><span class="feature-key">'+esc(a[0])+'</span><span class="feature-value">'+esc(a[1])+'</span></div>').join('');
      const html = '<div class="feature-popup"><div class="feature-popup-head"><span>Row '+(Number(row)+1)+'</span><span class="feature-popup-type">'+esc(type)+'</span></div><div class="feature-popup-grid">'+rows+'</div></div>';
      const click = () => { const now = Date.now(); if (lastMapClickRow === Number(row) && now - lastMapClickAt < 120) return; lastMapClickRow = Number(row); lastMapClickAt = now; focusRows([row], true); if (window.dg && window.dg.selectInTable) window.dg.selectInTable(String(row)); };
      object.bindPopup(html, { autoPan:false, maxWidth:360, closeButton:true }); object.on('click', click); if (object.eachLayer) object.eachLayer(child => child.on('click', click));
    } catch (e) { console.warn('Geo Viewer Plus could not parse row '+row, e); }
  }
  function focusRows(rows, openPopup) {
    selected.forEach(i => { const f=features.get(i); if(f) setStyle(f,false); }); selected=[];
    rows.forEach(i => { const f=features.get(Number(i)); if(f){ setStyle(f,true); selected.push(Number(i)); } });
    if (selected.length===1) {
      const f=features.get(selected[0]);
      if (!openPopup && f && f.getBounds) map.fitBounds(f.getBounds().pad(.25), { maxZoom:16, animate:true, duration:.35 });
      else if (!openPopup && f && f.getLatLng) map.setView(f.getLatLng(), Math.max(map.getZoom(), 15), { animate:true, duration:.35 });
      if (openPopup && f && f.openPopup) f.openPopup();
    }
  }
  function loadFeatures(payload) {
    clearFeatures(); const bounds=[]; const items=payload.features || [];
    items.forEach(item => { addWkt(item.wkt, item.row, item.attributes); const f=features.get(item.row); if(f && f.getBounds) bounds.push(f.getBounds()); else if(f && f.getLatLng) bounds.push(L.latLngBounds([f.getLatLng(),f.getLatLng()])); });
    document.getElementById('count').textContent = features.size; document.getElementById('geometry').textContent = payload.geometryColumn || 'geometry';
    const toolbarGeometry = document.getElementById('toolbarGeometry'); if (toolbarGeometry) toolbarGeometry.textContent = payload.geometryColumn || 'geometry';
    if(bounds.length) { const group=L.featureGroup(bounds.map(b=>L.rectangle(b,{opacity:0,fillOpacity:0}))); map.fitBounds(group.getBounds().pad(.12), { animate:false }); }
  }
  window.geoPlus = { addSources:addSourcesFromJava, addSource:addSourceFromJava, removeSource, switchSource, loadFeatures, focusRows, setDefaultSource };
  function updateZoomLabel() {
    const zoom = document.getElementById('zoom');
    if (zoom) zoom.textContent = 'Z=' + map.getZoom();
  }
  map.on('zoomend', updateZoomLabel);
  updateZoomLabel();
  const sourceSelect = document.getElementById('sourceSelect');
  if (sourceSelect) sourceSelect.addEventListener('change', () => {
    updateSourcePickerValue();
    renderSourceMenu();
    if (window.dg && window.dg.changeSource) window.dg.changeSource(sourceSelect.value);
  });
  const sourcePickerButton = document.getElementById('sourcePickerButton');
  if (sourcePickerButton) sourcePickerButton.addEventListener('click', toggleSourceMenu);
  document.addEventListener('click', event => {
    const picker=document.getElementById('sourcePicker');
    if (picker && !picker.contains(event.target)) closeSourceMenu();
  });
  const addSourceButton = document.getElementById('addSourceButton');
  if (addSourceButton) addSourceButton.addEventListener('click', () => {
    if (window.dg && window.dg.addMapSource) window.dg.addMapSource();
  });
  const defaultSourceButton = document.getElementById('defaultSourceButton');
  if (defaultSourceButton) defaultSourceButton.addEventListener('click', () => {
    if (window.dg && window.dg.setDefaultSource && sourceSelect) window.dg.setDefaultSource(sourceSelect.value);
  });
  const editSourceButton = document.getElementById('editSourceButton');
  if (editSourceButton) editSourceButton.addEventListener('click', () => {
    if (window.dg && window.dg.editMapSource && sourceSelect) window.dg.editMapSource(sourceSelect.value);
  });
  const removeSourceButton = document.getElementById('removeSourceButton');
  if (removeSourceButton) removeSourceButton.addEventListener('click', () => {
    if (window.dg && window.dg.removeMapSource && sourceSelect) window.dg.removeMapSource(sourceSelect.value);
  });
  const retrySourceButton = document.getElementById('retrySourceButton');
  if (retrySourceButton) retrySourceButton.addEventListener('click', retryActiveSource);
  const floatingToolbar = document.getElementById('floatingToolbar');
  const toolbarToggle = document.getElementById('toolbarToggle');
  if (floatingToolbar && toolbarToggle) {
    const savedCollapsed = window.localStorage.getItem('geoPlus.toolbarCollapsed');
    const setToolbarState = collapsed => { floatingToolbar.classList.toggle('collapsed', collapsed); toolbarToggle.setAttribute('aria-expanded', String(!collapsed)); window.localStorage.setItem('geoPlus.toolbarCollapsed', String(collapsed)); };
    if (savedCollapsed !== null) setToolbarState(savedCollapsed === 'true');
    toolbarToggle.addEventListener('click', () => setToolbarState(!floatingToolbar.classList.contains('collapsed')));
  }
  __GEO_VIEWER_READY__;
