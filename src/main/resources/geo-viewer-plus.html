<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark light">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body, #map { width:100%; height:100%; margin:0; overflow:hidden; background:#111827; font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .map-status { position:absolute; z-index:1000; left:14px; bottom:12px; padding:7px 10px; border:1px solid rgba(148,163,184,.32); border-radius:8px; background:rgba(15,23,42,.9); color:#cbd5e1; pointer-events:none; box-shadow:0 5px 15px rgba(0,0,0,.2); backdrop-filter:blur(10px); }
    .map-status strong { color:#22c55e; font-weight:600; }
    .map-status .zoom-level { color:#93c5fd; font-weight:600; }
    .leaflet-control-layers { border:1px solid rgba(148,163,184,.35)!important; border-radius:6px!important; background:#0f172a!important; color:#e2e8f0!important; }
    .leaflet-control-zoom a { background:#0f172a!important; color:#e2e8f0!important; border-color:#334155!important; }
    .leaflet-popup-content-wrapper { background:#0f172a; color:#e2e8f0; border:1px solid #334155; border-radius:9px; box-shadow:0 12px 28px rgba(0,0,0,.42); }
    .leaflet-popup-tip { background:#0f172a; }
    .leaflet-popup-content { margin:0; width:360px!important; max-width:calc(100vw - 56px); }
    .leaflet-popup-close-button { color:#94a3b8!important; font-size:18px!important; padding:6px 8px 0 0!important; }
    .leaflet-popup-close-button:hover { color:#f8fafc!important; }
    .feature-popup { width:100%; max-width:360px; overflow:hidden; line-height:1.35; }
    .feature-popup-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 30px 9px 12px; border-bottom:1px solid #263449; color:#f8fafc; font-weight:600; }
    .feature-popup-type { color:#22c55e; font-size:11px; font-weight:500; }
    .feature-popup-grid { max-height:238px; overflow-y:auto; overflow-x:hidden; padding:7px 8px 8px 12px; scrollbar-width:thin; scrollbar-color:#475569 transparent; }
    .feature-popup-grid::-webkit-scrollbar { width:7px; }
    .feature-popup-grid::-webkit-scrollbar-track { background:transparent; }
    .feature-popup-grid::-webkit-scrollbar-thumb { background:#475569; border-radius:8px; }
    .feature-row { display:grid; grid-template-columns:minmax(76px, 31%) minmax(0, 1fr); gap:10px; padding:5px 0; border-bottom:1px solid rgba(51,65,85,.42); }
    .feature-row:last-child { border-bottom:0; }
    .feature-key { color:#86efac; font-weight:600; overflow-wrap:anywhere; }
    .feature-value { color:#e2e8f0; min-width:0; overflow-wrap:anywhere; white-space:normal; }
    .map-notice { color:#fbbf24; }
    .floating-toolbar { position:absolute; z-index:1000; top:14px; right:14px; width:268px; padding:9px; border:1px solid rgba(148,163,184,.35); border-radius:13px; background:rgba(15,23,42,.9); box-shadow:0 12px 30px rgba(0,0,0,.3); color:#cbd5e1; backdrop-filter:blur(14px); transition:width .18s ease, padding .18s ease, background .18s ease, border-color .18s ease; }
    .floating-toolbar.collapsed { width:auto; padding:0; border-color:transparent; background:transparent; box-shadow:none; backdrop-filter:none; }
    .toolbar-toggle { display:flex; align-items:center; gap:7px; width:100%; height:32px; padding:0 9px; border:1px solid rgba(148,163,184,.36); border-radius:9px; background:rgba(15,23,42,.94); color:#dbeafe; cursor:pointer; box-shadow:0 7px 18px rgba(0,0,0,.22); }
    .collapsed .toolbar-toggle { width:40px; height:40px; justify-content:center; padding:0; border-radius:12px; background:rgba(15,23,42,.94); }
    .toolbar-toggle:hover { border-color:#60a5fa; background:#1e293b; }
    .toolbar-toggle-icon { color:#60a5fa; font-size:15px; line-height:1; }
    .toolbar-toggle-label { flex:1; text-align:left; font-size:11px; font-weight:700; letter-spacing:.06em; }
    .collapsed .toolbar-toggle-label { display:none; }
    .toolbar-toggle-chevron { color:#94a3b8; font-size:14px; transition:transform .18s ease; }
    .collapsed .toolbar-toggle-chevron { display:none; }
    .floating-toolbar:not(.collapsed) .toolbar-toggle-chevron { transform:rotate(180deg); }
    .toolbar-panel { padding:10px 3px 2px; }
    .floating-toolbar.collapsed .toolbar-panel { display:none; }
    .floating-toolbar-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:9px; padding:0 2px; }
    .floating-toolbar-title { color:#f8fafc; font-size:11px; font-weight:700; letter-spacing:.08em; }
    .floating-toolbar-geometry { max-width:100px; overflow:hidden; color:#93c5fd; font-size:11px; text-overflow:ellipsis; white-space:nowrap; }
    .floating-toolbar select { width:100%; height:32px; margin-bottom:8px; padding:0 8px; border:1px solid #475569; border-radius:8px; background:#1e293b; color:#f8fafc; outline:none; }
    .floating-toolbar select:focus { border-color:#60a5fa; box-shadow:0 0 0 2px rgba(96,165,250,.2); }
    .toolbar-actions { display:grid; grid-template-columns:1fr 1.2fr; gap:7px; }
    .toolbar-actions button { width:100%; height:29px; border:1px solid #475569; border-radius:7px; background:#263449; color:#dbeafe; cursor:pointer; }
    .toolbar-actions button:hover { background:#334155; border-color:#60a5fa; }
    .toolbar-actions .toolbar-default-button { color:#bfdbfe; }
    .floating-toolbar-note { margin-top:8px; color:#64748b; font-size:10px; line-height:1.35; }
  </style>
</head>
<body>
<div id="map"></div>
<div class="map-status"><strong id="count">0</strong> features · <span id="geometry">waiting for result set</span> · <span id="zoom" class="zoom-level">Z=5</span><span id="mapNotice" class="map-notice"></span></div>
<div class="floating-toolbar collapsed" id="floatingToolbar">
  <button class="toolbar-toggle" id="toolbarToggle" type="button" aria-expanded="false" title="Map controls"><span class="toolbar-toggle-icon">✦</span><span class="toolbar-toggle-label">MAP CONTROLS</span><span class="toolbar-toggle-chevron">⌄</span></button>
  <div class="toolbar-panel" id="toolbarPanel">
    <div class="floating-toolbar-head"><span class="floating-toolbar-title">GEO VIEWER PLUS</span><span id="toolbarGeometry" class="floating-toolbar-geometry">geom</span></div>
    <select id="sourceSelect" aria-label="Map source"></select>
    <div class="toolbar-actions"><button class="toolbar-default-button" id="defaultSourceButton" type="button">☆ Default</button><button id="addSourceButton" type="button">＋ Add map</button></div>
    <div class="floating-toolbar-note">Click a feature to select its row; select a row to locate it.</div>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map', { zoomControl:true, preferCanvas:true }).setView([43.79,87.62], 5);
  const layers = {};
  const features = new Map();
  const layerHealth = {};
  let selected = [];
  let currentLayer = null;
  let activeSource = '';
  let lastMapClickRow = -1;
  let lastMapClickAt = 0;
  const defaultStyle = { color:'#22c55e', weight:3, opacity:.9, fillColor:'#22c55e', fillOpacity:.28 };
  const selectedStyle = { color:'#ff5a1f', weight:7, opacity:1, fillColor:'#ff5a1f', fillOpacity:.55 };
  let defaultSource = '';
  function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function template(t) { return t.replaceAll('{s}', '{s}'); }
  function addSource(source) {
    const options = { maxZoom: 22, attribution: source.attribution || '', tms: !!source.tms };
    if (source.template.indexOf('{s}') >= 0) options.subdomains = (source.subdomains || 'abc').split('');
    const layer = L.tileLayer(template(source.template), options);
    ensureSourceOption(source);
    layerHealth[source.name] = { errors:0, retries:0 };
    layer.on('tileload', updateTileNotice);
    layer.on('tileerror', function() {
      const health = layerHealth[source.name];
      health.errors++;
      if (health.retries < 2) {
        health.retries++;
        setTimeout(() => layer.redraw(), 350 * health.retries);
      }
      updateTileNotice();
    });
    layers[source.name] = layer;
    if (!currentLayer) { currentLayer = layers[source.name]; currentLayer.addTo(map); activeSource = source.name; }
  }
  function addSourceFromJava(source, selectIt) { addSource(source); if (selectIt) { const select = document.getElementById('sourceSelect'); if (select) select.value = source.name; switchSource(source.name); } if (window.dg && window.dg.sourcesChanged) window.dg.sourcesChanged(Object.keys(layers)); }
  function switchSource(name) { if (!layers[name]) return; if (currentLayer) map.removeLayer(currentLayer); currentLayer = layers[name]; currentLayer.addTo(map); activeSource = name; const select = document.getElementById('sourceSelect'); if (select) select.value = name; updateTileNotice(); }
  function ensureSourceOption(source) {
    const select = document.getElementById('sourceSelect');
    if (!select || Array.from(select.options).some(option => option.value === source.name)) return;
    const option = document.createElement('option'); option.value = source.name; option.dataset.sourceName = source.name; option.textContent = source.name; select.appendChild(option); updateSourceLabels();
  }
  function updateSourceLabels() { const select=document.getElementById('sourceSelect'); if(!select) return; Array.from(select.options).forEach(option => { const name=option.dataset.sourceName || option.value; option.textContent=(name===defaultSource?'★ ':'')+name; }); }
  function setDefaultSource(name) { if (!layers[name]) return; defaultSource=name; updateSourceLabels(); }
  function updateTileNotice() {
    const notice = document.getElementById('mapNotice');
    const health = layerHealth[activeSource];
    if (!notice || !health || health.errors === 0) { if (notice) notice.textContent = ''; return; }
    notice.textContent = ' · ' + health.errors + ' tile errors (network/source)';
  }
  function setStyle(feature, selectedFlag) {
    if (feature.setStyle) feature.setStyle(selectedFlag ? selectedStyle : defaultStyle);
    else if (feature.eachLayer) feature.eachLayer(child => setStyle(child, selectedFlag));
    if (feature.setIcon) feature.setOpacity(selectedFlag ? 1 : .78);
  }
  function parseCoordinate(text) {
    const values = text.trim().split(/\s+/).map(Number);
    if (values.length < 2 || !Number.isFinite(values[0]) || !Number.isFinite(values[1])) throw new Error('Invalid coordinate');
    const coordinate = [values[1], values[0]];
    return coordinate;
  }
  function parseWktGroups(text) {
    let index = 0;
    function skip() { while (index < text.length && /\s/.test(text[index])) index++; }
    function parseGroup() {
      skip();
      if (text[index] !== '(') return parseCoordinate(readToken());
      index++;
      const result = [];
      while (index < text.length) {
        skip();
        if (text[index] === ')') { index++; return result; }
        result.push(text[index] === '(' ? parseGroup() : parseCoordinate(readToken()));
        skip();
        if (text[index] === ',') { index++; continue; }
        if (text[index] === ')') { index++; return result; }
        throw new Error('Invalid WKT group');
      }
      throw new Error('Unclosed WKT group');
    }
    function readToken() {
      const start = index;
      while (index < text.length && text[index] !== ',' && text[index] !== ')' && text[index] !== '(') index++;
      return text.slice(start, index);
    }
    return parseGroup();
  }
  function parseWkt(wkt) {
    const match = String(wkt).trim().replace(/^srid=\d+;\s*/i, '').match(/^([a-z]+)(?:\s+(?:z|m|zm))?\s*(.*)$/i);
    if (!match) throw new Error('Invalid WKT');
    const type = match[1].toUpperCase();
    const body = match[2].trim();
    if (/^empty$/i.test(body)) throw new Error('Empty geometry');
    const groups = parseWktGroups(body);
    let layer;
    if (type === 'POINT') layer = L.circleMarker(groups[0], { radius:6, color:defaultStyle.color, weight:2, fillColor:defaultStyle.fillColor, fillOpacity:.75 });
    else if (type === 'LINESTRING') layer = L.polyline(groups, defaultStyle);
    else if (type === 'POLYGON') layer = L.polygon(groups, defaultStyle);
    else if (type === 'MULTILINESTRING') layer = L.featureGroup(groups.map(line => L.polyline(line, defaultStyle)));
    else if (type === 'MULTIPOLYGON') layer = L.featureGroup(groups.map(polygon => L.polygon(polygon, defaultStyle)));
    else if (type === 'MULTIPOINT') layer = L.featureGroup(groups.map(point => L.circleMarker(point[0] || point, { radius:6, color:defaultStyle.color, weight:2, fillColor:defaultStyle.fillColor, fillOpacity:.75 })));
    else throw new Error('Unsupported geometry type: ' + type);
    return layer;
  }
  function clearFeatures() { features.forEach(f => f.remove()); features.clear(); selected=[]; }
  function addWkt(wkt, row, attributes) {
    try {
      const object = parseWkt(wkt);
      object.addTo(map); features.set(row, object); setStyle(object, false);
      const type = (String(wkt).match(/(?:srid=\d+;)?\s*([a-z]+)/i) || [,'geometry'])[1].toUpperCase();
      const rows = attributes.filter(a => a[1] !== '' && a[1] !== 'null').map(a => '<div class="feature-row"><span class="feature-key">'+esc(a[0])+'</span><span class="feature-value">'+esc(a[1])+'</span></div>').join('');
      const html = '<div class="feature-popup"><div class="feature-popup-head"><span>Row '+(Number(row)+1)+'</span><span class="feature-popup-type">'+esc(type)+'</span></div><div class="feature-popup-grid">'+rows+'</div></div>';
      const click = () => { const now = Date.now(); if (lastMapClickRow === Number(row) && now - lastMapClickAt < 120) return; lastMapClickRow = Number(row); lastMapClickAt = now; focusRows([row], true); if (window.dg && window.dg.selectInTable) window.dg.selectInTable(String(row)); };
      object.bindPopup(html, { autoPan:false, maxWidth:360, closeButton:true }); object.on('click', click); if (object.eachLayer) object.eachLayer(child => child.on('click', click));
    } catch (e) { console.warn('Geo Viewer Plus could not parse row '+row, e); }
  }
  function focusRows(rows, openPopup) {
    selected.forEach(i => { const f=features.get(i); if(f) setStyle(f,false); }); selected=[];
    rows.forEach(i => { const f=features.get(Number(i)); if(f){ setStyle(f,true); selected.push(Number(i)); } });
    if (selected.length===1) {
      const f=features.get(selected[0]);
      if (!openPopup && f && f.getBounds) map.fitBounds(f.getBounds().pad(.25), { maxZoom:16, animate:true, duration:.35 });
      else if (!openPopup && f && f.getLatLng) map.setView(f.getLatLng(), Math.max(map.getZoom(), 15), { animate:true, duration:.35 });
      if (openPopup && f && f.openPopup) f.openPopup();
    }
  }
  function loadFeatures(payload) {
    clearFeatures(); const bounds=[]; const items=payload.features || [];
    items.forEach(item => { addWkt(item.wkt, item.row, item.attributes); const f=features.get(item.row); if(f && f.getBounds) bounds.push(f.getBounds()); else if(f && f.getLatLng) bounds.push(L.latLngBounds([f.getLatLng(),f.getLatLng()])); });
    document.getElementById('count').textContent = features.size; document.getElementById('geometry').textContent = payload.geometryColumn || 'geometry';
    const toolbarGeometry = document.getElementById('toolbarGeometry'); if (toolbarGeometry) toolbarGeometry.textContent = payload.geometryColumn || 'geometry';
    if(bounds.length) { const group=L.featureGroup(bounds.map(b=>L.rectangle(b,{opacity:0,fillOpacity:0}))); map.fitBounds(group.getBounds().pad(.12), { animate:false }); }
  }
  window.geoPlus = { addSource:addSourceFromJava, switchSource, loadFeatures, focusRows, setDefaultSource };
  function updateZoomLabel() {
    const zoom = document.getElementById('zoom');
    if (zoom) zoom.textContent = 'Z=' + map.getZoom();
  }
  map.on('zoomend', updateZoomLabel);
  updateZoomLabel();
  const sourceSelect = document.getElementById('sourceSelect');
  if (sourceSelect) sourceSelect.addEventListener('change', () => {
    if (window.dg && window.dg.changeSource) window.dg.changeSource(sourceSelect.value);
  });
  const addSourceButton = document.getElementById('addSourceButton');
  if (addSourceButton) addSourceButton.addEventListener('click', () => {
    if (window.dg && window.dg.addMapSource) window.dg.addMapSource();
  });
  const defaultSourceButton = document.getElementById('defaultSourceButton');
  if (defaultSourceButton) defaultSourceButton.addEventListener('click', () => {
    if (window.dg && window.dg.setDefaultSource && sourceSelect) window.dg.setDefaultSource(sourceSelect.value);
  });
  const floatingToolbar = document.getElementById('floatingToolbar');
  const toolbarToggle = document.getElementById('toolbarToggle');
  if (floatingToolbar && toolbarToggle) {
    const savedCollapsed = window.localStorage.getItem('geoPlus.toolbarCollapsed');
    const setToolbarState = collapsed => { floatingToolbar.classList.toggle('collapsed', collapsed); toolbarToggle.setAttribute('aria-expanded', String(!collapsed)); window.localStorage.setItem('geoPlus.toolbarCollapsed', String(collapsed)); };
    if (savedCollapsed !== null) setToolbarState(savedCollapsed === 'true');
    toolbarToggle.addEventListener('click', () => setToolbarState(!floatingToolbar.classList.contains('collapsed')));
  }
  __GEO_VIEWER_READY__;
</script>
</body>
</html>
