<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark light">
  <style>__LEAFLET_CSS__</style>
  <style>
    :root { --panel-bg:#0b1424; --panel-surface:#111e32; --panel-raised:#172943; --panel-line:rgba(148,163,184,.2); --panel-muted:#7f91aa; --panel-text:#e7eefb; --panel-blue:#7db7ff; --panel-blue-strong:#3b82f6; --panel-green:#58d6a0; --panel-red:#ff9aa8; }
    * { box-sizing:border-box; }
    html, body, #map { width:100%; height:100%; margin:0; overflow:hidden; background:#111827; font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button, input, select { font:inherit; }
    button, input { touch-action:manipulation; }
    button:focus-visible, input:focus-visible { outline:2px solid var(--panel-blue); outline-offset:2px; }
    .map-status { display:flex; align-items:center; gap:9px; position:absolute; z-index:1000; left:14px; bottom:12px; max-width:calc(100vw - 28px); padding:8px 11px; border:1px solid rgba(148,163,184,.28); border-radius:12px; background:rgba(9,18,33,.9); color:#b8c6d9; pointer-events:none; box-shadow:0 8px 24px rgba(0,0,0,.24); backdrop-filter:blur(14px); }
    .status-dot { flex:0 0 auto; width:7px; height:7px; border-radius:50%; background:var(--panel-green); box-shadow:0 0 0 3px rgba(88,214,160,.14); }
    .status-copy { display:flex; align-items:baseline; gap:4px; white-space:nowrap; }
    .map-status strong { color:#8ee6bc; font-weight:700; font-variant-numeric:tabular-nums; }
    .status-divider { width:1px; height:14px; background:rgba(148,163,184,.25); }
    .map-status .zoom-level { color:var(--panel-blue); font-weight:700; font-variant-numeric:tabular-nums; }
    .leaflet-control-layers { border:1px solid rgba(148,163,184,.35)!important; border-radius:6px!important; background:#0f172a!important; color:#e2e8f0!important; }
    .leaflet-control-zoom a { background:#0f172a!important; color:#e2e8f0!important; border-color:#334155!important; }
    .leaflet-popup-content-wrapper { background:#0f172a; color:#e2e8f0; border:1px solid #334155; border-radius:9px; box-shadow:0 12px 28px rgba(0,0,0,.42); }
    .leaflet-popup-tip { background:#0f172a; }
    .leaflet-popup-content { margin:0; width:360px!important; max-width:calc(100vw - 56px); }
    .leaflet-popup-close-button { color:#94a3b8!important; font-size:18px!important; padding:6px 8px 0 0!important; }
    .leaflet-popup-close-button:hover { color:#f8fafc!important; }
    .feature-popup { width:100%; max-width:360px; overflow:hidden; line-height:1.35; }
    .feature-popup-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 30px 9px 12px; border-bottom:1px solid #263449; color:#f8fafc; font-weight:600; }
    .feature-popup-type { color:#22c55e; font-size:11px; font-weight:500; }
    .feature-popup-grid { max-height:238px; overflow-y:auto; overflow-x:hidden; padding:7px 8px 8px 12px; scrollbar-width:thin; scrollbar-color:#475569 transparent; }
    .feature-popup-grid::-webkit-scrollbar { width:7px; }
    .feature-popup-grid::-webkit-scrollbar-track { background:transparent; }
    .feature-popup-grid::-webkit-scrollbar-thumb { background:#475569; border-radius:8px; }
    .feature-row { display:grid; grid-template-columns:minmax(76px, 31%) minmax(0, 1fr); gap:10px; padding:5px 0; border-bottom:1px solid rgba(51,65,85,.42); }
    .feature-row:last-child { border-bottom:0; }
    .feature-key { color:#86efac; font-weight:600; overflow-wrap:anywhere; }
    .feature-value { color:#e2e8f0; min-width:0; overflow-wrap:anywhere; white-space:normal; }
    .map-notice { color:#fbbf24; }
    .map-retry-button { display:none; pointer-events:auto; min-height:26px; padding:3px 8px; border:1px solid rgba(251,191,36,.45); border-radius:7px; background:rgba(120,53,15,.7); color:#fde68a; cursor:pointer; }
    .map-retry-button.visible { display:inline-flex; }
    .floating-toolbar { position:absolute; z-index:1000; top:16px; right:16px; width:min(366px, calc(100vw - 32px)); border:1px solid var(--panel-line); border-radius:20px; background:linear-gradient(155deg, #0d1b30, #07101d); box-shadow:0 22px 60px rgba(0,0,0,.42), 0 0 0 1px rgba(255,255,255,.025) inset; color:var(--panel-text); transition:border-color .16s ease, box-shadow .16s ease; }
    .floating-toolbar::before { content:''; position:absolute; top:-1px; left:30px; right:30px; height:1px; background:linear-gradient(90deg, transparent, rgba(125,183,255,.7), transparent); pointer-events:none; }
    .floating-toolbar.collapsed { width:52px; height:52px; overflow:hidden; border-color:transparent; background:transparent; box-shadow:none; }
    .toolbar-topbar { display:flex; align-items:center; justify-content:space-between; min-height:68px; padding:12px 13px 11px 15px; border-bottom:1px solid rgba(148,163,184,.13); }
    .collapsed .toolbar-topbar { min-height:52px; padding:0; border:0; }
    .collapsed .toolbar-head-actions { width:52px; height:52px; }
    .toolbar-brand { display:flex; align-items:center; gap:10px; min-width:0; }
    .collapsed .toolbar-brand { display:none; }
    .toolbar-brand-mark { display:grid; flex:0 0 auto; width:32px; height:32px; place-items:center; border:1px solid rgba(125,183,255,.35); border-radius:10px; background:linear-gradient(145deg, rgba(59,130,246,.26), rgba(30,64,175,.2)); color:var(--panel-blue); box-shadow:0 7px 18px rgba(37,99,235,.18); }
    .toolbar-brand-mark svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    .toolbar-brand-copy { display:flex; min-width:0; flex-direction:column; gap:2px; }
    .toolbar-brand-kicker { color:#7c91ad; font-size:9px; font-weight:750; letter-spacing:.14em; }
    .toolbar-brand-title { overflow:hidden; color:#f5f8ff; font-size:14px; font-weight:750; text-overflow:ellipsis; white-space:nowrap; }
    .toolbar-head-actions { display:flex; align-items:center; gap:8px; }
    .toolbar-live { display:flex; align-items:center; gap:5px; padding:4px 7px; border:1px solid rgba(88,214,160,.18); border-radius:999px; background:rgba(16,185,129,.08); color:#9ee8c5; font-size:9px; font-weight:700; }
    .toolbar-live-dot { width:5px; height:5px; border-radius:50%; background:var(--panel-green); box-shadow:0 0 0 3px rgba(88,214,160,.1); }
    .collapsed .toolbar-live { display:none; }
    .toolbar-toggle { display:grid; width:32px; height:32px; place-items:center; padding:0; border:1px solid rgba(148,163,184,.25); border-radius:10px; background:rgba(23,41,67,.84); color:#c9ddf7; cursor:pointer; box-shadow:0 6px 16px rgba(0,0,0,.18); }
    .collapsed .toolbar-toggle { width:52px; height:52px; border-color:rgba(125,183,255,.38); border-radius:15px; background:rgba(11,20,36,.96); box-shadow:0 14px 30px rgba(0,0,0,.3); }
    .toolbar-toggle:hover { border-color:var(--panel-blue); background:#19345a; transform:translateY(-1px); }
    .toolbar-toggle:active { transform:translateY(0); }
    .toolbar-toggle svg { width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; transition:transform .2s ease; }
    .floating-toolbar:not(.collapsed) .toolbar-toggle svg { transform:rotate(180deg); }
    .toolbar-panel { padding:15px; }
    .floating-toolbar.collapsed .toolbar-panel { display:none; }
    .floating-toolbar-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin:0 1px 14px; }
    .floating-toolbar-title { color:#f8fafc; font-size:18px; font-weight:750; letter-spacing:-.02em; }
    .floating-toolbar-subtitle { max-width:248px; margin-top:4px; color:var(--panel-muted); font-size:10px; line-height:1.45; }
    .floating-toolbar-geometry { max-width:112px; overflow:hidden; padding:5px 8px; border:1px solid rgba(125,183,255,.24); border-radius:8px; background:rgba(59,130,246,.09); color:#a9ceff; font-size:10px; font-weight:650; text-overflow:ellipsis; white-space:nowrap; }
    .toolbar-group { position:relative; z-index:1; margin-bottom:11px; padding:12px; border:1px solid rgba(148,163,184,.15); border-radius:15px; background:rgba(17,30,50,.72); }
    .toolbar-group.source-group { z-index:30; padding-bottom:11px; }
    .toolbar-section-label { display:flex; align-items:center; justify-content:space-between; margin:0 0 8px; color:#d9e5f5; font-size:10px; font-weight:750; letter-spacing:.1em; text-transform:uppercase; }
    .toolbar-section-label::after { content:'BASE MAP'; color:#607894; font-size:8px; letter-spacing:.11em; }
    .toolbar-section-label.manage-label::after { content:'ACTIONS'; }
    .source-picker { position:relative; z-index:10; margin-bottom:9px; }
    .coordinate-mode { display:flex; align-items:center; gap:8px; min-height:30px; margin:0 0 5px; padding:0 9px; border:1px solid rgba(148,163,184,.2); border-radius:8px; background:rgba(6,14,27,.44); color:#9db1ca; font-size:10px; }
    .coordinate-mode span { flex:0 0 auto; }
    .coordinate-mode select { width:100%; min-width:0; border:0; outline:0; background:transparent; color:#e7eefb; font:inherit; cursor:pointer; }
    .coordinate-mode option { background:#10213a; color:#e7eefb; }
    .coordinate-summary { display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:23px; padding:0 2px; color:#7890ad; font-size:9px; }
    .coordinate-summary strong { color:#b9d4f7; font-weight:700; }
    .coordinate-summary span:last-child { overflow:hidden; color:#9ee8c5; font-weight:650; text-align:right; text-overflow:ellipsis; white-space:nowrap; }
    .source-picker-button { display:flex; align-items:center; justify-content:space-between; width:100%; min-height:48px; padding:0 12px; border:1px solid rgba(125,183,255,.3); border-radius:11px; background:linear-gradient(100deg, rgba(31,58,92,.95), rgba(22,42,70,.92)); color:#f6f9ff; outline:none; cursor:pointer; text-align:left; box-shadow:0 7px 18px rgba(0,0,0,.12); transition:border-color .18s ease, box-shadow .18s ease, background .18s ease; }
    .source-picker-button:hover, .source-picker-button[aria-expanded="true"] { border-color:var(--panel-blue); background:linear-gradient(100deg, rgba(36,71,112,.98), rgba(24,49,83,.96)); box-shadow:0 0 0 3px rgba(96,165,250,.12), 0 9px 22px rgba(0,0,0,.16); }
    .source-picker-leading { display:grid; flex:0 0 auto; width:25px; height:25px; margin-right:9px; place-items:center; border-radius:8px; background:rgba(125,183,255,.13); color:var(--panel-blue); }
    .source-picker-leading svg { width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    .source-picker-value { min-width:0; overflow:hidden; font-size:12px; font-weight:650; text-overflow:ellipsis; white-space:nowrap; }
    .source-picker-chevron { margin-left:8px; color:#a4bad4; font-size:15px; transition:transform .18s ease; }
    .source-picker-button[aria-expanded="true"] .source-picker-chevron { transform:rotate(180deg); }
    .source-menu { position:absolute; z-index:100; left:0; right:0; top:calc(100% + 8px); display:none; flex-direction:column; max-height:min(360px, calc(100vh - 175px)); overflow:hidden; padding:8px; border:1px solid rgba(125,183,255,.38); border-radius:14px; background:#0e1b2f; box-shadow:0 22px 48px rgba(0,0,0,.5); }
    .source-menu.open { display:flex; }
    .source-menu.open-up { top:auto; bottom:calc(100% + 8px); }
    .source-menu-head { display:flex; align-items:center; justify-content:space-between; margin:0 3px 7px; color:#dce9fa; font-size:10px; font-weight:750; }
    .source-menu-count { color:#7890ad; font-size:9px; font-weight:600; }
    .source-search { display:flex; align-items:center; gap:7px; min-height:34px; margin:0 0 7px; padding:0 9px; border:1px solid rgba(148,163,184,.2); border-radius:9px; background:rgba(6,14,27,.64); color:#88a2c1; }
    .source-search:focus-within { border-color:rgba(125,183,255,.7); box-shadow:0 0 0 2px rgba(96,165,250,.1); }
    .source-search svg { flex:0 0 auto; width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .source-search input { width:100%; min-width:0; padding:0; border:0; outline:0; background:transparent; color:#e7eefb; font-size:11px; }
    .source-search input::placeholder { color:#607894; }
    .source-menu-list { min-width:0; min-height:0; overflow-x:hidden; overflow-y:auto; scrollbar-width:thin; scrollbar-color:#496581 transparent; }
    .source-menu-list::-webkit-scrollbar { width:7px; }
    .source-menu-list::-webkit-scrollbar-track { background:transparent; }
    .source-menu-list::-webkit-scrollbar-thumb { background:#496581; border-radius:8px; }
    .source-menu-group { padding:7px 8px 4px; color:#6f87a4; font-size:9px; font-weight:750; letter-spacing:.1em; text-transform:uppercase; }
    .source-menu-option { display:flex; align-items:center; justify-content:space-between; min-width:0; width:100%; min-height:36px; margin:2px 0; padding:0 9px; border:0; border-radius:8px; background:transparent; color:#cfe0f5; cursor:pointer; text-align:left; overflow:hidden; transition:background .14s ease, color .14s ease; }
    .source-menu-option-label { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .source-menu-option::after { content:'›'; color:#5d7694; font-size:15px; opacity:0; transform:translateX(-3px); transition:opacity .14s ease, transform .14s ease; }
    .source-menu-option:hover, .source-menu-option[aria-selected="true"] { background:#1c3659; color:#f8fbff; }
    .source-menu-option:hover::after, .source-menu-option[aria-selected="true"]::after { opacity:1; transform:translateX(0); }
    .source-menu-option[aria-selected="true"] { box-shadow:inset 2px 0 var(--panel-blue); }
    .source-menu-empty { padding:18px 9px; color:#7890ad; text-align:center; }
    .source-select-hidden { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
    .toolbar-source-meta { display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:23px; color:#8297b0; font-size:10px; }
    .toolbar-source-meta span:last-child { min-width:0; max-width:186px; overflow:hidden; text-align:right; text-overflow:ellipsis; white-space:nowrap; }
    .toolbar-source-kind { display:inline-flex; align-items:center; gap:5px; padding:4px 7px; border-radius:6px; background:rgba(16,185,129,.11); color:#a7f3d0; font-weight:650; }
    .toolbar-source-kind::before { content:''; width:5px; height:5px; border-radius:50%; background:var(--panel-green); }
    .toolbar-source-kind.custom { background:rgba(234,179,8,.13); color:#fcd34d; }
    .toolbar-source-kind.custom::before { background:#facc15; }
    .toolbar-actions, .toolbar-manage-actions { display:grid; grid-template-columns:1.05fr 1fr; gap:8px; }
    .toolbar-manage-actions { grid-template-columns:1fr 1fr; margin-top:8px; }
    .toolbar-actions button, .toolbar-manage-actions button { display:flex; align-items:center; justify-content:center; gap:6px; width:100%; min-height:38px; border:1px solid rgba(148,163,184,.22); border-radius:9px; background:#1b2d47; color:#dbeafe; cursor:pointer; transition:background .16s ease, border-color .16s ease, transform .16s ease, color .16s ease; }
    .toolbar-actions button:hover, .toolbar-manage-actions button:hover { background:#274365; border-color:#6eaaf1; color:#f8fbff; transform:translateY(-1px); }
    .toolbar-actions button:active, .toolbar-manage-actions button:active { transform:translateY(0); }
    .toolbar-actions button:disabled, .toolbar-manage-actions button:disabled { cursor:not-allowed; opacity:.4; transform:none; }
    .toolbar-actions .toolbar-default-button { border-color:rgba(125,183,255,.36); background:rgba(59,130,246,.16); color:#bfdbfe; }
    .toolbar-manage-actions .toolbar-remove-button { color:var(--panel-red); }
    .toolbar-icon { display:inline-flex; }
    .toolbar-icon svg { width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .toolbar-link-status { display:flex; align-items:center; gap:9px; margin:0 1px 12px; padding:10px; border:1px solid rgba(88,214,160,.16); border-radius:12px; background:linear-gradient(100deg, rgba(16,185,129,.1), rgba(16,185,129,.025)); }
    .toolbar-link-icon { display:grid; flex:0 0 auto; width:28px; height:28px; place-items:center; border-radius:8px; background:rgba(88,214,160,.13); color:#86e8bc; }
    .toolbar-link-icon svg { width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .toolbar-link-copy { min-width:0; }
    .toolbar-link-title { color:#c9f7df; font-size:10px; font-weight:700; }
    .toolbar-link-subtitle { margin-top:2px; overflow:hidden; color:#7fa993; font-size:9px; text-overflow:ellipsis; white-space:nowrap; }
    .floating-toolbar-note { margin:0 2px 1px; color:#7288a3; font-size:10px; line-height:1.55; }
    /* The map is already inside a tool window: keep its controls deliberately compact. */
    .floating-toolbar { top:10px; right:10px; width:min(258px, calc(100vw - 20px)); border-radius:13px; }
    .floating-toolbar::before, .toolbar-brand-kicker, .toolbar-live, .floating-toolbar-head, .toolbar-link-status, .toolbar-section-label, .toolbar-source-meta, .floating-toolbar-note { display:none; }
    .toolbar-topbar { min-height:46px; padding:7px 8px 7px 10px; border-bottom-color:rgba(148,163,184,.12); }
    .toolbar-brand { gap:7px; }
    .toolbar-brand-mark { width:25px; height:25px; border-radius:7px; }
    .toolbar-brand-mark svg { width:14px; height:14px; }
    .toolbar-brand-title { font-size:11px; }
    .toolbar-toggle { width:28px; height:28px; border-radius:8px; }
    .collapsed .toolbar-toggle { width:42px; height:42px; border-radius:11px; }
    .floating-toolbar.collapsed { width:42px; height:42px; }
    .collapsed .toolbar-topbar, .collapsed .toolbar-head-actions { width:42px; height:42px; min-height:42px; }
    .toolbar-panel { padding:8px; }
    .toolbar-group, .toolbar-group.source-group { margin:0; padding:0; border:0; border-radius:0; background:transparent; }
    .source-picker { margin:0 0 7px; }
    .coordinate-mode { min-height:27px; margin-bottom:6px; padding:0 7px; font-size:9px; }
    .source-picker-button { min-height:36px; padding:0 9px; border-radius:8px; }
    .source-picker-leading { width:20px; height:20px; margin-right:7px; border-radius:6px; }
    .source-picker-leading svg { width:12px; height:12px; }
    .source-picker-value { font-size:11px; }
    .source-menu { max-height:min(300px, calc(100vh - 110px)); padding:6px; border-radius:10px; }
    .source-menu-head { margin:0 2px 5px; }
    .source-search { min-height:29px; margin-bottom:4px; padding:0 7px; }
    .source-menu-option { min-height:30px; font-size:11px; }
    .toolbar-actions, .toolbar-manage-actions { grid-template-columns:repeat(4, 1fr); gap:5px; }
    .toolbar-manage-actions { margin-top:5px; }
    .toolbar-actions button, .toolbar-manage-actions button { min-height:29px; padding:0 5px; border-radius:7px; font-size:10px; }
    .toolbar-actions .toolbar-default-button { grid-column:auto; }
    .leaflet-control-attribution { padding:2px 5px!important; border-radius:5px 0 0 0!important; background:rgba(9,18,33,.86)!important; color:#a9bad0!important; font-size:10px!important; }
    .leaflet-control-attribution a { color:#9bc5ff!important; }
    .source-warning { position:absolute; z-index:1000; right:0; bottom:27px; display:none; max-width:min(320px, calc(100vw - 24px)); padding:4px 7px; border:1px solid rgba(251,191,36,.38); border-radius:6px 0 0 6px; background:rgba(69,38,10,.9); color:#fde68a; font-size:10px; line-height:1.35; pointer-events:none; }
    .source-warning.visible { display:block; }
    .geo-point-marker { width:18px!important; height:18px!important; margin:-9px 0 0 -9px!important; border:2px solid #f8fbff; border-radius:50% 50% 50% 3px; background:radial-gradient(circle at 35% 30%, #d8ffec 0 14%, #51d49a 18% 46%, #177b57 50% 100%); box-shadow:0 3px 9px rgba(0,0,0,.48), 0 0 0 3px rgba(34,197,94,.18); transform:rotate(-45deg); transition:filter .16s ease, transform .16s ease, box-shadow .16s ease; }
    .geo-point-marker::after { content:''; position:absolute; inset:4px; border:1px solid rgba(255,255,255,.72); border-radius:50%; }
    .geo-point-marker.selected { background:radial-gradient(circle at 35% 30%, #fff0d6 0 14%, #ff9b57 18% 46%, #d94b16 50% 100%); box-shadow:0 4px 12px rgba(255,90,31,.5), 0 0 0 4px rgba(255,90,31,.2); filter:saturate(1.12); transform:rotate(-45deg) scale(1.24); }
    @media (max-width:560px) { .floating-toolbar { top:10px; right:10px; width:min(366px, calc(100vw - 20px)); } .map-status { left:10px; bottom:10px; } .floating-toolbar-title { font-size:16px; } }
    @media (prefers-reduced-motion:reduce) { *, *::before, *::after { scroll-behavior:auto!important; transition-duration:.01ms!important; animation-duration:.01ms!important; animation-iteration-count:1!important; } }
  </style>
</head>
<body>
<div id="map"></div>
<div class="map-status"><span class="status-dot"></span><span class="status-copy"><strong id="count">0</strong><span>要素</span></span><span class="status-divider" aria-hidden="true"></span><span id="geometry">等待结果集</span><span class="status-divider" aria-hidden="true"></span><span id="zoom" class="zoom-level">Z=5</span><span id="dataNotice" class="map-notice"></span><span id="mapNotice" class="map-notice"></span><button id="retrySourceButton" class="map-retry-button" type="button">重试</button></div>
<div id="sourceWarning" class="source-warning" role="status"></div>
<div class="floating-toolbar collapsed" id="floatingToolbar">
